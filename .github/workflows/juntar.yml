# Refaz só a junção de um render já feito (as partes ficam guardadas por 2 dias como Artifacts da execução).
# Disparar: editar .github/juntar-pedido.txt (run_id=, pasta=, sub=, args=, nome=, skill_ref= opcional) e dar push em main.
# A skill aula-animada vem do repositório engcesarribeiro/skills (secret SKILLS_DEPLOY_KEY).
name: Juntar render

on:
  push:
    branches: [main]
    paths: [".github/juntar-pedido.txt"]

permissions:
  contents: write
  actions: read

env:
  SKILL: .claude/skills/aula-animada
  EXPLAINER_SKILL: ${{ github.workspace }}/.claude/skills/aula-animada
  EXPLAINER_VOZ: en-US-AndrewMultilingualNeural

jobs:
  juntar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Ler pedido
        id: p
        run: |
          get() { grep -E "^$1=" .github/juntar-pedido.txt | head -1 | cut -d= -f2-; }
          for k in run_id pasta sub args nome; do echo "$k=$(get $k)" >> "$GITHUB_OUTPUT"; done
          R=$(get skill_ref | tr -d '\r '); echo "skill_ref=${R:-main}" >> "$GITHUB_OUTPUT"
      - name: Baixar a skill aula-animada (repositório skills)
        uses: actions/checkout@v4
        with:
          repository: engcesarribeiro/skills
          ref: ${{ steps.p.outputs.skill_ref }}
          ssh-key: ${{ secrets.SKILLS_DEPLOY_KEY }}
          path: _skills
          sparse-checkout: aula-animada
      - name: Instalar a skill e o explainer dela na pasta do vídeo
        run: |
          echo "skill aula-animada @ $(git -C _skills rev-parse HEAD)"
          mkdir -p .claude/skills && rm -rf "$SKILL" && mv _skills/aula-animada "$SKILL" && rm -rf _skills
          cp -f "$SKILL/template/explainer.py" "${{ steps.p.outputs.pasta }}/explainer.py"
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/cache/restore@v4
        with:
          path: ~/aptdebs
          key: apt-manim-${{ runner.os }}-v1
      - name: Instalar ffmpeg
        run: |
          if ls ~/aptdebs/ffmpeg_*.deb >/dev/null 2>&1 && sudo dpkg -i ~/aptdebs/*.deb > /tmp/dpkg.log 2>&1 && command -v ffprobe; then
            echo "ffmpeg do cache"
          elif sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg; then
            echo "ffmpeg do apt"
          else
            curl -sSL -o /tmp/ff.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
            mkdir -p /tmp/ff && tar xf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1
            sudo cp /tmp/ff/ffmpeg /tmp/ff/ffprobe /usr/local/bin/
          fi
          ffmpeg -version | head -1
      - uses: actions/download-artifact@v4
        with:
          name: vozes
          path: ${{ steps.p.outputs.pasta }}
          run-id: ${{ steps.p.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: cena-*
          path: ${{ steps.p.outputs.pasta }}/media/${{ steps.p.outputs.sub }}
          run-id: ${{ steps.p.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Emendar as fatias e juntar as cenas
        working-directory: ${{ steps.p.outputs.pasta }}
        run: |
          S="$GITHUB_WORKSPACE/$SKILL/scripts"
          python "$S/fatias.py" juntar video.py --sub ${{ steps.p.outputs.sub }} --planos planos
          python "$S/render.py" video.py ${{ steps.p.outputs.args }} --concat-only
      - name: Publicar no ramo renders
        run: |
          set -e
          mkdir -p /tmp/v && cp ${{ steps.p.outputs.pasta }}/out/*.mp4 /tmp/v/
          N="${{ steps.p.outputs.nome }}"
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin renders >/dev/null; then git fetch -q --depth 1 origin renders && git checkout -q -f renders
          else git checkout -q --orphan renders && git rm -rqf .; fi
          git clean -fdq
          mkdir -p videos
          for f in /tmp/v/*.mp4; do d="videos/$N-$(basename "$f")"; rm -f "$d" "$d".parte*
            # arquivo acima de 95 MB vai em partes de 90 MB (limite do GitHub); para juntar: cat arquivo.mp4.parte* > arquivo.mp4
            if [ "$(stat -c%s "$f")" -gt 95000000 ]; then split -b 90m -d "$f" "$d.parte"; else cp "$f" "$d"; fi; done
          git add -A videos
          git add videos && git commit -qm "Render $N (junção da execução ${{ steps.p.outputs.run_id }})" && git push -q origin renders
