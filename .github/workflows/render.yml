# Renderiza um vídeo com narração em até 20 máquinas ao mesmo tempo:
#   vozes  -> gera todas as vozes uma vez (em fila) e planeja as fatias das cenas longas
#   cena   -> uma máquina por fatia (cenas Manim longas) ou por cena (Remotion e cenas curtas), lendo as vozes prontas
#   juntar -> emenda as fatias, monta o áudio de cada cena, junta tudo e publica no ramo "renders"
# Disparar: editar .github/render-pedido.txt (pasta=..., qualidade=final|rascunho|previa, vertical=true|false,
#           fps=60 opcional, alvo=35 opcional: segundos de vídeo por fatia) e dar push em main.
name: Renderizar vídeo

on:
  push:
    branches: [main]
    paths: [".github/render-pedido.txt"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  SKILL: .claude/skills/manim-explainer

jobs:
  vozes:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      pasta: ${{ steps.p.outputs.pasta }}
      qualidade: ${{ steps.p.outputs.qualidade }}
      vertical: ${{ steps.p.outputs.vertical }}
      fps: ${{ steps.p.outputs.fps }}
      nome: ${{ steps.p.outputs.nome }}
      sub: ${{ steps.p.outputs.sub }}
      args: ${{ steps.p.outputs.args }}
      tarefas: ${{ steps.f.outputs.tarefas }}
    steps:
      - uses: actions/checkout@v4
      - name: Ler pedido
        id: p
        run: |
          get() { grep -E "^$1=" .github/render-pedido.txt | head -1 | cut -d= -f2- | tr -d '\r '; }
          PASTA=$(get pasta); QUAL=$(get qualidade); VERT=$(get vertical); FPS=$(get fps); ALVO=$(get alvo)
          QUAL=${QUAL:-final}; VERT=${VERT:-false}
          if [ -z "$FPS" ]; then FPS=30; [ "$QUAL" = "previa" ] && FPS=15; fi
          MODO=$QUAL; [ "$QUAL" = "previa" ] && MODO=preview
          SUB=$MODO; [ "$VERT" = "true" ] && SUB="${MODO}_v"
          ARGS=""
          [ "$QUAL" = "final" ] && ARGS="--final --fps $FPS"
          [ "$QUAL" = "rascunho" ] && ARGS="--rascunho"
          [ "$VERT" = "true" ] && ARGS="$ARGS --vertical"
          SUF=""; [ "$VERT" = "true" ] && SUF="-vertical"
          echo "pasta=$PASTA" >> "$GITHUB_OUTPUT"; echo "qualidade=$QUAL" >> "$GITHUB_OUTPUT"
          echo "vertical=$VERT" >> "$GITHUB_OUTPUT"; echo "fps=$FPS" >> "$GITHUB_OUTPUT"
          echo "sub=$SUB" >> "$GITHUB_OUTPUT"; echo "args=$ARGS" >> "$GITHUB_OUTPUT"
          echo "alvo=${ALVO:-35}" >> "$GITHUB_OUTPUT"
          echo "nome=$(basename "$PASTA")-$QUAL$SUF-${FPS}fps" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/cache@v4
        with:
          path: ~/aptdebs
          key: apt-manim-${{ runner.os }}-v1
      - name: Instalar LaTeX, ffmpeg e Manim
        run: |
          # pacotes .deb guardados no cache do GitHub: instala sem depender do servidor do Ubuntu (que às vezes leva 15 min)
          if ls ~/aptdebs/*.deb >/dev/null 2>&1 && sudo dpkg -i ~/aptdebs/*.deb > /tmp/dpkg.log 2>&1; then
            echo "instalado do cache ($(ls ~/aptdebs/*.deb | wc -l) pacotes)"
          else
            sudo apt-get update -q
            mkdir -p ~/aptdebs/partial
            sudo apt-get install -y -q --no-install-recommends -o dir::cache::archives="$HOME/aptdebs" \
              ffmpeg libcairo2-dev libpango1.0-dev pkg-config \
              texlive-latex-base texlive-latex-extra texlive-latex-recommended texlive-fonts-recommended \
              texlive-science texlive-lang-portuguese cm-super lmodern dvisvgm fonts-liberation
            sudo chown -R "$USER" ~/aptdebs; rm -rf ~/aptdebs/partial ~/aptdebs/lock
          fi
          pip install -q "manim==0.20.1" "pillow<12" edge-tts
      - name: Gerar todas as vozes (em fila)
        working-directory: ${{ steps.p.outputs.pasta }}
        run: python "$GITHUB_WORKSPACE/$SKILL/scripts/pre_voz.py"
      - name: Planejar as fatias
        id: f
        working-directory: ${{ steps.p.outputs.pasta }}
        run: |
          R=""; [ "${{ steps.p.outputs.vertical }}" = "true" ] && R="--vertical"
          python "$GITHUB_WORKSPACE/$SKILL/scripts/fatias.py" plano video.py --fps ${{ steps.p.outputs.fps }} \
            --alvo ${{ steps.p.outputs.alvo }} --out planos $R > /tmp/tarefas.json
          echo "tarefas=$(cat /tmp/tarefas.json)" >> "$GITHUB_OUTPUT"
          cat /tmp/tarefas.json
          rm -rf planos/_m
      - uses: actions/upload-artifact@v4
        with:
          name: vozes
          path: |
            ${{ steps.p.outputs.pasta }}/media/tts
            ${{ steps.p.outputs.pasta }}/planos
          retention-days: 2
          if-no-files-found: error

  cena:
    needs: vozes
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        t: ${{ fromJSON(needs.vozes.outputs.tarefas) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/cache/restore@v4
        with:
          path: ~/aptdebs
          key: apt-manim-${{ runner.os }}-v1
      - name: Instalar LaTeX, ffmpeg e Manim
        run: |
          # pacotes .deb guardados no cache do GitHub: instala sem depender do servidor do Ubuntu (que às vezes leva 15 min)
          if ls ~/aptdebs/*.deb >/dev/null 2>&1 && sudo dpkg -i ~/aptdebs/*.deb > /tmp/dpkg.log 2>&1; then
            echo "instalado do cache ($(ls ~/aptdebs/*.deb | wc -l) pacotes)"
          else
            sudo apt-get update -q
            mkdir -p ~/aptdebs/partial
            sudo apt-get install -y -q --no-install-recommends -o dir::cache::archives="$HOME/aptdebs" \
              ffmpeg libcairo2-dev libpango1.0-dev pkg-config \
              texlive-latex-base texlive-latex-extra texlive-latex-recommended texlive-fonts-recommended \
              texlive-science texlive-lang-portuguese cm-super lmodern dvisvgm fonts-liberation
            sudo chown -R "$USER" ~/aptdebs; rm -rf ~/aptdebs/partial ~/aptdebs/lock
          fi
          pip install -q "manim==0.20.1" "pillow<12" edge-tts
      - uses: actions/setup-node@v4
        if: matrix.t.fatia == '' && hashFiles(format('{0}/remotion/package.json', needs.vozes.outputs.pasta)) != ''
        with: {node-version: 22}
      - name: Instalar o Remotion do vídeo
        if: matrix.t.fatia == '' && hashFiles(format('{0}/remotion/package.json', needs.vozes.outputs.pasta)) != ''
        working-directory: ${{ needs.vozes.outputs.pasta }}/remotion
        run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: vozes
          path: ${{ needs.vozes.outputs.pasta }}
      - name: Renderizar
        working-directory: ${{ needs.vozes.outputs.pasta }}
        run: |
          F=""; [ -n "${{ matrix.t.fatia }}" ] && F="--fatia ${{ matrix.t.fatia }}"
          python "$GITHUB_WORKSPACE/$SKILL/scripts/render.py" video.py ${{ needs.vozes.outputs.args }} \
            --only "${{ matrix.t.cena }}" $F --timeout 19000 --tentativas 2 2>&1 | tee log.txt
          test "${PIPESTATUS[0]}" -eq 0
      - name: Separar o vídeo
        working-directory: ${{ needs.vozes.outputs.pasta }}
        run: |
          mkdir -p saida
          F=$(find "media/${{ needs.vozes.outputs.sub }}" -name "${{ matrix.t.id }}.mp4" -not -path "*partial_movie_files*" | head -1)
          cp "$F" "saida/${{ matrix.t.id }}.mp4"
      - uses: actions/upload-artifact@v4
        with:
          name: cena-${{ matrix.t.id }}
          path: ${{ needs.vozes.outputs.pasta }}/saida/${{ matrix.t.id }}.mp4
          retention-days: 2
          if-no-files-found: error

  juntar:
    needs: [vozes, cena]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/cache/restore@v4
        with:
          path: ~/aptdebs
          key: apt-manim-${{ runner.os }}-v1
      - name: Instalar ffmpeg
        run: |
          if ls ~/aptdebs/ffmpeg_*.deb >/dev/null 2>&1 && sudo dpkg -i ~/aptdebs/*.deb > /tmp/dpkg.log 2>&1 && command -v ffprobe; then
            echo "ffmpeg do cache"
          elif sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg; then
            echo "ffmpeg do apt"
          else
            curl -sSL -o /tmp/ff.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
            mkdir -p /tmp/ff && tar xf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1
            sudo cp /tmp/ff/ffmpeg /tmp/ff/ffprobe /usr/local/bin/
          fi
      - uses: actions/download-artifact@v4
        with:
          name: vozes
          path: ${{ needs.vozes.outputs.pasta }}
      - uses: actions/download-artifact@v4
        with:
          pattern: cena-*
          path: ${{ needs.vozes.outputs.pasta }}/media/${{ needs.vozes.outputs.sub }}
      - name: Emendar as fatias e juntar as cenas
        working-directory: ${{ needs.vozes.outputs.pasta }}
        run: |
          S="$GITHUB_WORKSPACE/$SKILL/scripts"
          python "$S/fatias.py" juntar video.py --sub ${{ needs.vozes.outputs.sub }} --planos planos
          python "$S/render.py" video.py ${{ needs.vozes.outputs.args }} --concat-only
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.vozes.outputs.nome }}
          path: ${{ needs.vozes.outputs.pasta }}/out/*.mp4
          retention-days: 14
      - name: Publicar no ramo renders (para baixar com git)
        run: |
          set -e
          mkdir -p /tmp/v && cp ${{ needs.vozes.outputs.pasta }}/out/*.mp4 /tmp/v/
          N="${{ needs.vozes.outputs.nome }}"
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin renders >/dev/null; then git fetch -q --depth 1 origin renders && git checkout -q -f renders
          else git checkout -q --orphan renders && git rm -rqf .; fi
          git clean -fdq
          mkdir -p videos
          for f in /tmp/v/*.mp4; do d="videos/$N-$(basename "$f")"; rm -f "$d" "$d".parte*
            # arquivo acima de 95 MB vai em partes de 90 MB (limite do GitHub); para juntar: cat arquivo.mp4.parte* > arquivo.mp4
            if [ "$(stat -c%s "$f")" -gt 95000000 ]; then split -b 90m -d "$f" "$d.parte"; else cp "$f" "$d"; fi; done
          git add -A videos
          git add videos && git commit -qm "Render $N (execução ${{ github.run_id }})" && git push -q origin renders
