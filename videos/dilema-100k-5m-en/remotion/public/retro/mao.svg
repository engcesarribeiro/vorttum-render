    <path d="M196,54 L370,58 C392,59 394,90 370,91 L200,94 Z" fill="#F4EEE2"/>
    <path d="M230,84 L368,82 C380,82 384,88 372,91 L210,94 Z" fill="url(#h)" stroke="none"/>
    <path d="M300,60 C304,68 304,82 300,90" fill="none" stroke-width="3"/>
    <path d="M352,63 C364,62 372,66 372,72" fill="none" stroke-width="3"/>
    <!-- mão e dedos dobrados -->
    <path d="M104,52 C140,38 182,40 208,56 L210,94 C226,100 226,124 206,128 C222,134 220,156 200,158 C214,164 210,184 188,184 L134,180 C114,176 106,166 104,156 Z" fill="#F4EEE2"/>
    <path d="M120,150 C150,166 170,176 188,184 L134,180 C116,176 108,168 106,158 Z" fill="url(#h)" stroke="none"/>
    <path d="M150,104 C170,100 196,100 208,96" fill="none" stroke-width="3.5"/>
    <path d="M156,128 C176,126 194,128 206,128" fill="none" stroke-width="3.5"/>
    <path d="M152,156 C170,156 186,158 200,158" fill="none" stroke-width="3.5"/>
