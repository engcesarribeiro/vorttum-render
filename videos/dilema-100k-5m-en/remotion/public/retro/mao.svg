    <path d="M14,34 L98,46 L98,164 L14,178 Z" fill="#F4EEE2"/>
    <path d="M14,34 L98,46 L98,164 L14,178 Z" fill="url(#hx)" stroke="none" opacity="0.55"/>
    <path d="M98,46 L110,58 L98,72 L110,86 L98,100 L110,114 L98,128 L110,142 L98,156 L106,166" fill="none" stroke-width="4"/>
