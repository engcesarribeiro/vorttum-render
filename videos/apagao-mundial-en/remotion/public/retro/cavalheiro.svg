<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" width="600" height="760">
  <!-- Retrato original da skill (cavalheiro do século XIX em traço de gravura), livre para uso.
       Corte da boca para o RetratoFalante: boca = {y: 0.58, y1: 0.75, x0: 0.34, x1: 0.66} (frações da imagem). -->
  <defs>
    <pattern id="h1" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#161616" stroke-width="1.5"/>
    </pattern>
    <pattern id="h2" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
