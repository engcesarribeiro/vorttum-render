      <line x1="0" y1="0" x2="5" y2="0" stroke="#161616" stroke-width="1.1"/>
    </pattern>
    <pattern id="h3" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(70)">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#F2ECDF" stroke-width="1"/>
    </pattern>
    <pattern id="cabelo" width="14" height="10" patternUnits="userSpaceOnUse">
      <path d="M0,8 C3,0 7,0 9,6 C11,10 14,6 14,3" fill="none" stroke="#EDE6D8" stroke-width="1.3"/>
    </pattern>
  </defs>
